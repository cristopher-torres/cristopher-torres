name: Metrics

on:
  # Se actualiza todos los días a las 03:00 (hora de Chile aprox.)
  schedule:
    - cron: "0 6 * * *"
  # Permite ejecutarla a mano desde la pestaña Actions
  workflow_dispatch:
  # Se ejecuta cuando se modifica este archivo
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Estadísticas generales (incluye repos privados y colaboraciones)
      - name: Estadísticas
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics/stats.svg
          template: classic
          base: header, activity, community, repositories
          repositories_affiliations: owner, collaborator, organization_member
          config_timezone: America/Santiago
          config_twemoji: yes
          # Estilo oscuro azul (Tokyo Night)
          extras_css: |
            .items-wrapper { background: #1a1b27; border: 1px solid #2f3449; border-radius: 14px; padding: 10px 14px 12px; }
            svg { color: #a9b1d6; }
            h1, h2 { color: #70a5fd; }
            h1 span { color: #70a5fd; }
            .field svg { fill: #bf91f3; }
            .calendar .day { outline: none; }
            .calendar .day[fill="#ebedf0"] { fill: #2f3449; }
            .calendar .day[fill="#9be9a8"] { fill: #1f4f8f; }
            .calendar .day[fill="#40c463"] { fill: #3b7dd8; }
            .calendar .day[fill="#30a14e"] { fill: #5c9cf5; }
            .calendar .day[fill="#216e39"] { fill: #7aa2f7; }

      # Lenguajes más usados (incluye repos privados y colaboraciones)
      - name: Lenguajes
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics/languages.svg
          template: classic
          base: ""
          repositories_affiliations: owner, collaborator, organization_member
          config_timezone: America/Santiago
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html
          plugin_languages_colors: github
          # Estilo oscuro azul (Tokyo Night)
          extras_css: |
            .items-wrapper { background: #1a1b27; border: 1px solid #2f3449; border-radius: 14px; padding: 10px 14px 12px; }
            svg { color: #a9b1d6; }
            h1, h2 { color: #70a5fd; }
            .field svg { fill: #bf91f3; }
